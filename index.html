    }
  }

    .lg\:col-span-2 {

    }
    .lg\:col-span-3 {
      grid-column: span 3 / span 3;
    }

      grid-template-columns: repeat(2, minmax(0, 1fr));

      grid-template-columns: repeat(3, minmax(0, 1fr));
    }
    .lg\:grid-cols-5 {
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }
    .lg\:grid-cols-15 {
      grid-template-columns: repeat(15, minmax(0, 1fr));
    }
    .lg\:px-8 {
      padding-inline: calc(var(--spacing) * 8);
    }
  }
  @media (width >= 80rem) {
    .xl\:col-span-4 {
      grid-column: span 4 / span 4;
    }
    .xl\:grid-cols-4 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .xl\:flex-row {
      flex-direction: row;
    }

      align-items: center;
    }
  }

@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap');
.nx-root{background:#0F070A;color:#FDF2F4;font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif}
.nx-root *{box-sizing:border-box}
.nx-mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.nx-card{background:#1A0D12;border:1px solid #3B1D28}
.nx-soft{background:#26131A}
.nx-deep{background:#0F070A}
.nx-b{border-color:#3B1D28}
.nx-text{color:#FDF2F4}
.nx-muted{color:#A88B94}
.nx-green{color:#34D399}
.nx-red{color:#F43F5E}
.nx-crimson{color:#FB7185}
.nx-primary{background:linear-gradient(135deg,#9F1239,#E11D48);color:#fff;box-shadow:0 0 0 1px rgba(225,29,72,.35),0 8px 24px -8px rgba(225,29,72,.55)}
.nx-primary:hover{filter:brightness(1.08)}
.nx-ghost{background:#26131A;border:1px solid #3B1D28;color:#FDF2F4}
.nx-ghost:hover{background:#2F1720;border-color:#5A2A3A}
.nx-hover:hover{background:#26131A}
.nx-hero{background:radial-gradient(120% 140% at 100% 0%,#E11D48 0%,#9F1239 42%,#4C0519 100%);border:1px solid #BE123C;box-shadow:0 20px 50px -20px rgba(225,29,72,.6)}
.nx-input{background:#26131A;border:1px solid #3B1D28;color:#FDF2F4;border-radius:.65rem;padding:.6rem .8rem;width:100%;outline:none;font-size:.875rem;transition:border-color .15s, box-shadow .15s}
.nx-input::placeholder{color:#6F5560}
.nx-input:focus{border-color:#E11D48;box-shadow:0 0 0 3px rgba(225,29,72,.18)}
.nx-input:disabled{opacity:.45}
select.nx-input{appearance:none;background-image:linear-gradient(45deg,transparent 50%,#A88B94 50%),linear-gradient(135deg,#A88B94 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:2rem}
.nx-scroll::-webkit-scrollbar{height:6px;width:6px}
.nx-scroll::-webkit-scrollbar-thumb{background:#3B1D28;border-radius:99px}
.nx-scroll::-webkit-scrollbar-track{background:transparent}
.nx-glow-green{box-shadow:0 0 14px rgba(16,185,129,.55)}
.nx-fade{animation:nxFade .25s ease}
@keyframes nxFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.nx-plate{background:linear-gradient(135deg,#FDE68A 0%,#F59E0B 30%,#B45309 55%,#FCD34D 75%,#92400E 100%)}
.nx-plate-locked{background:repeating-linear-gradient(135deg,#1A0D12 0 10px,#1F1016 10px 20px)}
.nx-shine{position:relative;overflow:hidden}
.nx-shine:after{content:"";position:absolute;inset:-50%;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);animation:nxShine 4s ease-in-out infinite}
@keyframes nxShine{0%{transform:translateX(-60%)}60%,100%{transform:translateX(60%)}}
